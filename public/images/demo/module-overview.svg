  <text x="405" y="190" fill="#153f34" font-family="Georgia, serif" font-size="48">Module overview</text>
  <text x="405" y="230" fill="#66736c" font-family="Arial, sans-serif" font-size="23">Illustrative content only - final product screens pending approval</text>
  <g><rect x="405" y="285" width="315" height="155" rx="18" fill="#edf3ef"/><rect x="750" y="285" width="315" height="155" rx="18" fill="#f4ead0"/><rect x="1095" y="285" width="365" height="155" rx="18" fill="#e9eef0"/></g>
