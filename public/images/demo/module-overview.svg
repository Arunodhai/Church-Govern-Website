<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Church Govern module overview</title>
  <desc id="desc">A clearly labelled demo interface concept with navigation, summary cards, an activity chart and a work queue.</desc>
  <rect width="1600" height="1000" fill="#f3f0e8"/>
  <rect x="70" y="65" width="1460" height="870" rx="28" fill="#fffdf8" stroke="#c7d2cb" stroke-width="4"/>
  <rect x="70" y="65" width="280" height="870" rx="28" fill="#153f34"/>
  <circle cx="140" cy="145" r="38" fill="#f4e7b7"/><path d="M140 120v50M118 145h44" stroke="#153f34" stroke-width="8" stroke-linecap="round"/>
  <text x="195" y="154" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Church Govern</text>
  <g fill="#dfe9e3" font-family="Arial, sans-serif" font-size="22"><text x="120" y="265">Overview</text><text x="120" y="335">People &amp; records</text><text x="120" y="405">Requests</text><text x="120" y="475">Reports</text><text x="120" y="545">Settings</text></g>
  <rect x="104" y="225" width="212" height="62" rx="12" fill="#ffffff" opacity=".16"/>
